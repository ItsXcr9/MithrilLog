[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mithrillog"
version = "0.1.0"
description = "Local AI-assisted log deduplication and summarization pipeline"
readme = "README.md"
authors = [{ name = "Saeed" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.24,<0.31",
  "pydantic>=2.6,<3.0",
  "python-json-logger>=2.0,<3.0",
  "orjson>=3.9,<4.0",
  "structlog>=24.1,<25.0",
  "llama-cpp-python>=0.3.0",
  "schedule>=1.2,<1.3",
  "aiosqlite>=0.19,<0.20",
  "numpy>=1.26,<2.0",
  "scikit-learn>=1.5,<1.6",
  "prometheus-client>=0.20,<0.21",
  "tenacity>=8.2,<9.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.7,<14.0",
  "openai>=1.54,<2.0",
  "google-generativeai>=0.8,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<8.3",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<1.12"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mithrillog"]

[tool.ruff]
select = ["E", "F", "I"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

