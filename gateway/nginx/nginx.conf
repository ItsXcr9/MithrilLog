server {
    listen 1515;
    server_name localhost;

    # Resolver needed for dynamic proxy_pass if we used it, but we are hardcoding for stability
    # resolver 127.0.0.11 valid=30s;

    # --- Gateway App (Login & Auth) ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Internal Auth Endpoint ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Project Proxies ---
    
    # Project 1
    location = /p/project1 {
        return 302 /p/project1/;
    }

    location /p/project1/ {
        auth_request /_auth;
        
        # If auth fails, redirect to login
        error_page 401 = @error401;

        # Proxy to upstream
        proxy_pass http://127.0.0.1:9000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Project 2
    location = /p/project2 {
        return 302 /p/project2/;
    }

    location /p/project2/ {
        auth_request /_auth;
        error_page 401 = @error401;

        proxy_pass http://127.0.0.1:9800/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Project 3
    location = /p/project3 {
        return 302 /p/project3/;
    }

    location /p/project3/ {
        auth_request /_auth;
        error_page 401 = @error401;

        proxy_pass http://127.0.0.1:9900/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @error401 {
        return 302 /?error=unauthorized;
    }
}
