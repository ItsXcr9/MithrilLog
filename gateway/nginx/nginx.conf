    }

    location @error401 {
        return 302 $scheme://$host/?error=unauthorized;
    }

    location @error403 {
        # Redirect to gateway suspended endpoint
        # The gateway will extract project ID from session cookie
        return 302 $scheme://$host/suspended;
    }
}
