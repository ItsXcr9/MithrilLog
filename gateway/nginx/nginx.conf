server {
    listen 1515;
    server_name localhost;

    # Resolver needed for dynamic proxy_pass if we used it, but we are hardcoding for stability
    # resolver 127.0.0.11 valid=30s;

    # --- Gateway App (Login & Auth) ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Internal Auth Endpoint ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Project Proxies ---
    
    # Project: tebyan
    location = /p/tebyan {
        return 302 /p/tebyan/;
    }

    location /p/tebyan/logs/tail {
        auth_request /_auth;
        error_page 401 = @error401;
        error_page 403 = @error403;

        proxy_pass http://127.0.0.1:9000/logs/tail;
        
        # SSE-specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "keep-alive";
        proxy_http_version 1.1;
        
        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeout for long-lived connections
        proxy_read_timeout 24h;
        
        # Tell Cloudflare/Browser not to buffer
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
        add_header Connection "keep-alive";
    }

    location /p/tebyan/ {
        auth_request /_auth;
        error_page 401 = @error401;
        error_page 403 = @error403;

        proxy_pass http://127.0.0.1:9000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

