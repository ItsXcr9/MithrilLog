services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_gateway_app
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://user:password@127.0.0.1:5432/gateway_db
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: log_gateway_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway

  db:
    image: postgres:15-alpine
    container_name: log_gateway_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gateway_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway_db_data:/var/lib/postgresql/data

volumes:
  gateway_db_data:
