environment: dev
timezone: Asia/Tehran
llm:
  # Options: llama_cpp (local GGUF), local (alias), openai, gemini
  backend: gemini
  # Path to GGUF file when using llama_cpp/local backend
  model_path: ./models/llama4-dolphin-8B.Q3_K_M.gguf
  context_length: 8192
  temperature: 0.2
  top_p: 0.9
  max_tokens: 100000
  # Set when backend == openai (ChatGPT-compatible)
  # When left null, OPENAI_API_KEY from .env (if present) is used
  openai_api_key: null
  openai_model: gpt-5-mini
  openai_base_url: null
  # Set when backend == gemini
  # When left null, GEMINI_API_KEY from .env (if present) is used
  gemini_api_key: AIzaSyBPVfd9gaxGvc0FWZzcruZghvWa7MCTcJQ
  gemini_model: gemini-2.5-flash-lite
ingest:
  host: 0.0.0.0
  udp_port: 5514
  tcp_port: 5614
  bucket_dir: ./data/buckets
  max_bucket_minutes: 1
  bloom_error_rate: 0.0001
  reservoir_size: 200
  retention_days: 30
  forward_to_host: null
  forward_to_port: null
summary:
  hourly_at_minute: 9
  daily_at_hour: 0
  daily_at_minute: 50
  report_dir: ./data/reports
  # Log levels to analyze with AI (Supported: DEBUG, INFO, WARNING, ERROR, CRITICAL)
  # Default focuses on errors only. Set to ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"] to analyze all levels
  analysis_levels:
    - ERROR
    - CRITICAL
storage:
  sqlite_path: ./data/mithrillog.db
prompts:
  hourly: ./prompts/hourly_summary.txt
  daily: ./prompts/daily_summary.txt
  anomaly: ./prompts/anomaly_report.txt
  highlight_analysis: ./prompts/highlight_analysis.txt
  trend: ./prompts/trend_analysis.txt
web:
  title: Xcr9 Log Console
alert:
  enabled: true
  telegram_bot_token: "8409577730:AAGA8UfNTLp0_Zz5ECWVqulk2HDSiN7Bhrc"
  telegram_chat_id: "-1003438533112"
  error_threshold: 10
cors:
  allowed_origins:
    - "https://mithrillog.xcr9.site"
    - "http://localhost:9900"
    - "http://127.0.0.1:9900"
logging:
  patterns:
    # Example: Suppress noisy health checks
    # - pattern: "GET /health"
    #   action: SUPPRESS
    
    # Example: Allow critical errors even if they match other suppression rules
    # - pattern: "CRITICAL FAILURE"
    #   action: ALLOW
    
    # Example: Reclassify specific errors as warnings
    # - pattern: "connection reset"
    #   action: RECLASSIFY
    #   new_level: WARNING
    #   extra_fields:
    #     type: network_glitch

    # User requested rule: Treat "saeed" as a fatal error
    # Supported levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
    - pattern: "saeed"
      action: RECLASSIFY
      new_level: CRITICAL
remote_logging:
  # Send MithrilLog's own application logs to central server for self-monitoring
  enabled: true
  host: 65.109.200.75
  port: 5515
  protocol: udp  # udp or tcp