<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MithrilLog Summaries</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="top-bar glass">
      <div>
        <p class="eyebrow">MITHRILLOG</p>
        <h1>Observability Console</h1>
      <p class="subtitle">
          A polished, dark-mode surface for live log intelligence.
      </p>
      </div>
      <div class="top-actions">
        <button id="global-refresh">Refresh Data</button>
      </div>
    </header>

    <main>
      <section class="hero-grid fullscreen">
        <article id="focused-panel" class="focus-card glass fullscreen-card">
          <p class="muted">Loading latest hourly summary…</p>
        </article>
      </section>

      <section class="timeline-panel glass">
        <div class="section-header">
          <h2>Hourly Timeline</h2>
          <div class="controls stack">
            <label>
              History window
              <select id="hourly-history">
                <option value="6">6h</option>
                <option value="12" selected>12h</option>
                <option value="24">24h</option>
                <option value="48">48h</option>
              </select>
            </label>
            <div class="pager">
              <button id="hourly-prev">Prev</button>
              <span id="hourly-page-indicator">Page 1/1</span>
              <button id="hourly-next">Next</button>
            </div>
            <button id="hourly-refresh">Refresh</button>
          </div>
        </div>
        <div id="hourly-list" class="card-grid"></div>
      </section>

      <section class="error-monitor glass" id="error-monitor">
        <div class="section-header">
          <h2>Notable Incidents</h2>
          <div class="controls">
            <label>
              Show last
              <select id="error-limit">
                <option value="6">6</option>
                <option value="10" selected>10</option>
                <option value="16">16</option>
              </select>
              windows
            </label>
            <button id="error-refresh">Refresh</button>
          </div>
        </div>
        <div id="error-feed" class="card-grid tight"></div>
      </section>

      <section>
        <div class="section-header">
          <h2>Daily Summaries</h2>
          <div class="controls">
            <label>
              Show last
              <select id="daily-limit">
                <option value="7">7</option>
                <option value="10">10</option>
                <option value="14">14</option>
              </select>
              days
            </label>
            <button id="daily-refresh">Refresh</button>
          </div>
        </div>
        <div id="daily-container" class="card-grid"></div>
      </section>
    </main>

    <footer>
      <span>
        Data source:
        <code>/summaries/hourly</code>,
        <code>/summaries/daily</code>,
        <code>/insights/errors</code>
      </span>
    </footer>

    <template id="summary-card-template">
      <article class="card">
        <header>
          <h3 class="window"></h3>
          <span class="meta"></span>
        </header>
        <section class="summary"></section>
        <details>
          <summary>More details</summary>
          <div class="details">
            <div class="stats"></div>
            <div class="highlights"></div>
            <pre class="anomalies"></pre>
          </div>
        </details>
      </article>
    </template>

    <script>
      const focusedPanel = document.getElementById("focused-panel");
      const hourlyList = document.getElementById("hourly-list");
      const dailyContainer = document.getElementById("daily-container");
      const errorFeed = document.getElementById("error-feed");
      const hourlyHistory = document.getElementById("hourly-history");
      const hourlyRefresh = document.getElementById("hourly-refresh");
      const hourlyPrev = document.getElementById("hourly-prev");
      const hourlyNext = document.getElementById("hourly-next");
      const hourlyPageIndicator = document.getElementById("hourly-page-indicator");
      const dailyLimit = document.getElementById("daily-limit");
      const dailyRefresh = document.getElementById("daily-refresh");
      const errorLimit = document.getElementById("error-limit");
      const errorRefresh = document.getElementById("error-refresh");
      const globalRefresh = document.getElementById("global-refresh");
      const template = document.getElementById("summary-card-template");

      const HOURLY_PAGE_SIZE = 6;
      let hourlyData = [];
      let hourlyPage = 0;
      let focusedItem = null;
      let focusedKind = "hourly";

      const formatDateRange = (start, end) => {
        const startDate = new Date(start);
        const endDate = new Date(end);
        return `${startDate.toLocaleString()} → ${endDate.toLocaleString()}`;
      };

      const renderStats = (stats) => {
        if (!stats || stats.total_events === undefined) return "No stats.";
        const severity = Object.entries(stats.by_severity || {})
          .map(([name, count]) => `${name}: ${count}`)
          .join(", ");
        const hosts = Object.entries(stats.top_hosts || {})
          .map(([name, count]) => `${name}: ${count}`)
          .join(", ");
        const apps = Object.entries(stats.top_apps || {})
          .map(([name, count]) => `${name}: ${count}`)
          .join(", ");
        return `
          <p><strong>Total events:</strong> ${stats.total_events}</p>
          <p><strong>Unique events:</strong> ${stats.unique_events ?? "—"}</p>
          <p><strong>By severity:</strong> ${severity || "—"}</p>
          <p><strong>Top hosts:</strong> ${hosts || "—"}</p>
          <p><strong>Top apps:</strong> ${apps || "—"}</p>
        `;
      };

      const renderHighlightSources = (highlight) => {
        const sources = highlight.source_hosts || highlight.sources;
        if (!sources || !Object.keys(sources).length) {
          return "";
        }
        const chips = Object.entries(sources)
          .slice(0, 3)
          .map(([host, count]) => `<span class="chip">${host}×${count}</span>`)
          .join("");
        return `<div class="highlight-sources">${chips}</div>`;
      };

      const renderHighlights = (highlights = []) => {
        if (!highlights.length) {
          return "<p>No highlight samples captured.</p>";
        }
        return `
          <h4>Highlights</h4>
          <ul>
            ${highlights
              .slice(0, 10)
              .map(
                (h) => `
                <li>
                  <strong>[${h.severity}] ${h.host}/${h.app}</strong>
                  (${h.occurrences ?? 1}×) — ${h.message}
                  ${renderHighlightSources(h)}
                </li>`
              )
              .join("")}
          </ul>
        `;
      };

      const buildCard = (item, kind, options = {}) => {
        const card = template.content.firstElementChild.cloneNode(true);
        const windowEl = card.querySelector(".window");
        const metaEl = card.querySelector(".meta");
        const summaryEl = card.querySelector(".summary");
        const statsEl = card.querySelector(".stats");
        const highlightsEl = card.querySelector(".highlights");
        const anomaliesEl = card.querySelector(".anomalies");

        if (kind === "hourly") {
          windowEl.textContent = formatDateRange(
            item.window_start,
            item.window_end
          );
        } else {
          windowEl.textContent = formatDateRange(
            item.day_start,
            item.day_end
          );
        }
        metaEl.textContent = `Total ${item?.stats?.total_events ?? 0} events`;

        summaryEl.textContent = item.summary || "No summary available.";
        statsEl.innerHTML = renderStats(item.stats);
        highlightsEl.innerHTML = renderHighlights(item.highlights);
        anomaliesEl.textContent =
          (item.anomalies || "").trim() || "No anomalies reported.";

        if (options.selectable) {
          card.classList.add("selectable-card");
          card.addEventListener("click", options.onSelect);
        }

        return card;
      };

      const renderFocus = () => {
        if (!focusedItem) {
          focusedPanel.innerHTML =
            '<div class="empty">Select a window to see its details.</div>';
          return;
        }
        const item = focusedItem;
        const stats = item.stats || {};
        const title =
          focusedKind === "hourly"
            ? formatDateRange(item.window_start, item.window_end)
            : formatDateRange(item.day_start, item.day_end);
        const topSeverity =
          Object.entries(stats.by_severity || {})[0]?.join(": ") || "—";
        const topHost =
          Object.entries(stats.top_hosts || {})[0]?.join(": ") || "—";
        const topApp =
          Object.entries(stats.top_apps || {})[0]?.join(": ") || "—";
        const highlightHtml = (item.highlights || [])
          .slice(0, 4)
          .map(
            (h) => `
              <div class="focus-highlight">
                <span class="pill severity-${h.severity || "info"}">${
              h.severity || "info"
            }</span>
                <p>${h.message || "No message provided."}</p>
                <small>${h.host || "unknown"} / ${h.app || "-"} • ${
              h.occurrences ?? 1
            }×</small>
              </div>
            `
          )
          .join("");
        const highlightAnalysis =
          (item.highlight_analysis || "").trim() ||
          "LLM insights pending. Ensure analyzer job ran for this window.";

        focusedPanel.innerHTML = `
          <div class="focus-header">
            <p class="eyebrow">Latest ${focusedKind === "hourly" ? "hourly" : "daily"} summary</p>
            <h2>${title}</h2>
          </div>
          <div class="focus-metrics">
            <div>
              <span>Total</span>
              <strong>${stats.total_events ?? 0}</strong>
            </div>
            <div>
              <span>Unique</span>
              <strong>${stats.unique_events ?? "—"}</strong>
            </div>
            <div>
              <span>Top severity</span>
              <strong>${topSeverity}</strong>
            </div>
            <div>
              <span>Top host</span>
              <strong>${topHost}</strong>
            </div>
            <div>
              <span>Top app</span>
              <strong>${topApp}</strong>
            </div>
          </div>
          <p class="focus-summary">${
            item.summary || "No summary available."
          }</p>
          <div class="ai-highlights">
            <h3>Highlights analyze</h3>
            <p class="muted">${highlightAnalysis}</p>
          </div>
          <div class="focus-highlight-wrap">
            ${highlightHtml || "<p class='muted'>No highlights captured.</p>"}
          </div>
        `;
      };

      const renderHourlyList = () => {
        const history = hourlyData.slice(1);
        hourlyList.innerHTML = "";
        if (!history.length) {
          hourlyList.innerHTML =
            '<p class="empty">No additional hourly summaries yet.</p>';
          hourlyPageIndicator.textContent = "No history";
          hourlyPrev.disabled = true;
          hourlyNext.disabled = true;
          return;
        }
        const totalPages = Math.max(
          1,
          Math.ceil(history.length / HOURLY_PAGE_SIZE)
        );
        hourlyPage = Math.min(hourlyPage, totalPages - 1);
        const start = hourlyPage * HOURLY_PAGE_SIZE;
        const pageItems = history.slice(start, start + HOURLY_PAGE_SIZE);
        for (const item of pageItems) {
          hourlyList.appendChild(
            buildCard(item, "hourly", {
              selectable: true,
              onSelect: () => setFocus(item, "hourly"),
            })
          );
        }
        hourlyPageIndicator.textContent = `Page ${hourlyPage + 1}/${totalPages}`;
        hourlyPrev.disabled = hourlyPage === 0;
        hourlyNext.disabled = hourlyPage >= totalPages - 1;
      };

      const loadHourlyData = async () => {
        const limit = parseInt(hourlyHistory.value, 10);
        const response = await fetch(`/summaries/hourly?limit=${limit}`);
        if (!response.ok) {
          throw new Error("Failed to load hourly summaries");
        }
        const data = await response.json();
        hourlyData = data.items || [];
        hourlyPage = 0;
        if (hourlyData.length) {
          setFocus(hourlyData[0], "hourly");
        } else {
          setFocus(null, "hourly");
        }
        renderHourlyList();
      };

      const loadDailyData = async () => {
        const limit = parseInt(dailyLimit.value, 10);
        const response = await fetch(`/summaries/daily?limit=${limit}`);
        if (!response.ok) {
          throw new Error("Failed to load daily summaries");
        }
        const data = await response.json();
        dailyContainer.innerHTML = "";
        if (!data.items || !data.items.length) {
          dailyContainer.innerHTML = '<p class="empty">No summaries yet.</p>';
          return;
        }
        for (const item of data.items) {
          dailyContainer.appendChild(
            buildCard(item, "daily", {
              selectable: true,
              onSelect: () => setFocus(item, "daily"),
            })
          );
        }
      };

      hourlyRefresh.addEventListener("click", () =>
        loadHourlyData().catch(console.error)
      );
      hourlyHistory.addEventListener("change", () =>
        loadHourlyData().catch(console.error)
      );
      hourlyPrev.addEventListener("click", () => {
        if (hourlyPage > 0) {
          hourlyPage -= 1;
          renderHourlyList();
        }
      });
      hourlyNext.addEventListener("click", () => {
        const history = hourlyData.slice(1);
        const totalPages = Math.max(
          1,
          Math.ceil(history.length / HOURLY_PAGE_SIZE)
        );
        if (hourlyPage < totalPages - 1) {
          hourlyPage += 1;
          renderHourlyList();
        }
      });

      dailyRefresh.addEventListener("click", () =>
        loadDailyData().catch(console.error)
      );
      dailyLimit.addEventListener("change", () =>
        loadDailyData().catch(console.error)
      );

      const buildErrorCard = (item) => {
        const card = document.createElement("article");
        card.className = "card error-card";
        const windowLabel = formatDateRange(item.window_start, item.window_end);
        const severityPills = (item.severity_breakdown || [])
          .map(
            (entry) =>
              `<span class="pill severity-${entry.severity}">${entry.severity}: ${entry.count}</span>`
          )
          .join("");
        const topHosts = (item.top_hosts || [])
          .map((host) => `<span class="chip">${host.host}×${host.count}</span>`)
          .join("");
        const highlights = (item.highlights || [])
          .map(
            (h) => `
              <li>
                <strong>[${h.severity}] ${h.host}/${h.app}</strong>
                (${h.occurrences ?? 1}×) — ${h.message}
              </li>
            `
          )
          .join("");
        const topHighlight = (item.highlights || [])[0];
        const incidentSummary = topHighlight
          ? `${topHighlight.message} — ${topHighlight.host}/${topHighlight.app}`
          : "Review severity mix to understand the spike.";
        const actionHint = topHighlight
          ? `Inspect ${topHighlight.host} (${topHighlight.app}) for recurring ${topHighlight.severity} events.`
          : "Drill into affected hosts for more context.";
        card.innerHTML = `
          <header>
            <h3>${windowLabel}</h3>
            <span class="meta">${item.total_errors} critical events</span>
          </header>
          <p class="incident-summary">${incidentSummary}</p>
          <div class="error-meta">
            <div>
              <h4>Severity mix</h4>
              <div class="pill-row">
                ${severityPills || "<span class='pill'>No data</span>"}
              </div>
            </div>
            <div>
              <h4>Top hosts</h4>
              <div class="pill-row">
                ${topHosts || "<span class='chip'>None</span>"}
              </div>
            </div>
          </div>
          <div class="error-highlights">
            <h4>Samples</h4>
            <ul>${highlights || "<li>No error highlights captured.</li>"}</ul>
          </div>
          <p class="muted action-hint">${actionHint}</p>
        `;
        return card;
      };

      const setFocus = (item, kind) => {
        focusedItem = item;
        focusedKind = kind;
        renderFocus();
      };

      const loadErrorInsights = async () => {
        const limit = parseInt(errorLimit.value, 10);
        const response = await fetch(`/insights/errors?limit=${limit}`);
        if (!response.ok) {
          throw new Error("Failed to load error insights");
        }
        const data = await response.json();
        errorFeed.innerHTML = "";
        const items = data.items || [];
        if (!items.length) {
          errorFeed.innerHTML =
            '<p class="empty">No critical errors detected recently.</p>';
          return;
        }
        for (const item of items) {
          errorFeed.appendChild(buildErrorCard(item));
        }
      };

      const bootstrap = async () => {
        try {
          await Promise.all([loadHourlyData(), loadDailyData(), loadErrorInsights()]);
        } catch (err) {
          console.error(err);
          const errorBox = document.createElement("div");
          errorBox.className = "error";
          errorBox.textContent =
            "Failed to load summaries. Check API status and try again.";
          document.body.prepend(errorBox);
        }
      };

      errorRefresh.addEventListener("click", () =>
        loadErrorInsights().catch(console.error)
      );
      errorLimit.addEventListener("change", () =>
        loadErrorInsights().catch(console.error)
      );

      globalRefresh.addEventListener("click", () =>
        bootstrap().catch(console.error)
      );

      bootstrap();
    </script>
  </body>
</html>
