<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MithrilLog Summaries</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="top-bar glass">
      <div>
        <p class="eyebrow">MITHRILLOG</p>
        <h1>Observability Console</h1>
      <p class="subtitle">
          A polished, dark-mode surface for live log intelligence.
      </p>
      </div>
      <div class="top-actions">
        <button id="global-refresh">Refresh Data</button>
      </div>
    </header>

    <main>
      <section class="hero-grid fullscreen">
        <article id="focused-panel" class="focus-card glass fullscreen-card">
          <p class="muted">Loading latest hourly summary…</p>
        </article>
      </section>

      <section class="timeline-panel glass">
        <div class="section-header">
          <h2>Hourly Timeline</h2>
          <div class="controls stack">
            <label>
              History window
              <select id="hourly-history">
                <option value="6">6h</option>
                <option value="12" selected>12h</option>
                <option value="24">24h</option>
                <option value="48">48h</option>
              </select>
            </label>
            <div class="pager">
              <button id="hourly-prev">Prev</button>
              <span id="hourly-page-indicator">Page 1/1</span>
              <button id="hourly-next">Next</button>
            </div>
            <button id="hourly-refresh">Refresh</button>
          </div>
        </div>
        <div id="hourly-list" class="card-grid"></div>
      </section>

      <section class="error-monitor glass" id="error-monitor">
        <div class="section-header">
          <h2>Notable Incidents</h2>
          <div class="controls">
            <label>
              Show last
              <select id="error-limit">
                <option value="6">6</option>
                <option value="10" selected>10</option>
                <option value="16">16</option>
              </select>
              windows
            </label>
            <button id="error-refresh">Refresh</button>
          </div>
        </div>
        <div id="error-feed" class="card-grid tight"></div>
      </section>

      <section>
        <div class="section-header">
          <h2>Daily Summaries</h2>
          <div class="controls">
            <label>
              Show last
              <select id="daily-limit">
                <option value="7">7</option>
                <option value="10">10</option>
                <option value="14">14</option>
              </select>
              days
            </label>
            <button id="daily-refresh">Refresh</button>
          </div>
        </div>
        <div id="daily-container" class="card-grid"></div>
      </section>
    </main>

    <footer>
      <span>
        Data source:
        <code>/summaries/hourly</code>,
        <code>/summaries/daily</code>,
        <code>/insights/errors</code>
      </span>
    </footer>

    <template id="summary-card-template">
      <article class="card">
        <header>
          <h3 class="card-title"></h3>
          <span class="card-meta"></span>
        </header>
        <section class="card-summary"></section>
        <details>
          <summary>More details</summary>
          <div class="details">
            <div class="stats-grid"></div>
            <div class="highlights-list"></div>
            <pre class="anomalies-text"></pre>
          </div>
        </details>
      </article>
    </template>

    <script src="/static/dashboard.js"></script>
  </body>
</html>
