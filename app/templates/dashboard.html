<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/tail-search.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js" onerror="console.error('Failed to load D3 from jsdelivr, trying unpkg...'); this.onerror=null; this.src='https://unpkg.com/d3@7.8.5/dist/d3.min.js';"></script>
  </head>
  <body>
    <header class="top-bar glass">
      <div>
        <p class="eyebrow">MITHRILLOG</p>
        <h1>{{ title }}</h1>
      <p class="subtitle">
          Live log intelligence.
      </p>
      </div>
      <div class="top-actions">
        <button id="global-refresh">Refresh Data</button>
      </div>
    </header>

    <main>
      <section class="hero-grid fullscreen">
        <article id="focused-panel" class="focus-card glass fullscreen-card">
          <p class="muted">Loading latest hourly summary…</p>
        </article>
      </section>

      <section class="timeline-panel glass">
        <div class="section-header">
          <h2>Hourly Timeline</h2>
          <div class="controls stack">
            <label>
              History window
              <select id="hourly-history">
                <option value="4" selected>4h</option>
                <option value="6">6h</option>
                <option value="12">12h</option>
                <option value="24">24h</option>
                <option value="48">48h</option>
              </select>
            </label>
            <div class="pager">
              <button id="hourly-prev">Prev</button>
              <span id="hourly-page-indicator">Page 1/1</span>
              <button id="hourly-next">Next</button>
            </div>
            <button id="hourly-refresh">Refresh</button>
          </div>
        </div>
        <div id="hourly-list" class="card-grid"></div>
      </section>

      <section class="search-panel glass">
        <div class="section-header">
          <h2>🔍 Log Search</h2>
          <div class="controls">
            <input type="text" id="search-input" placeholder="Search logs (IP, User ID, Error, Message)..." />
            <select id="search-hours">
              <option value="1">Last 1h</option>
              <option value="6" selected>Last 6h</option>
              <option value="24">Last 24h</option>
            </select>
            <select id="search-severity">
              <option value="">All Severities</option>
              <option value="emerg">Emergency</option>
              <option value="alert">Alert</option>
              <option value="crit">Critical</option>
              <option value="err">Error</option>
              <option value="warn">Warning</option>
              <option value="notice">Notice</option>
              <option value="info">Info</option>
              <option value="debug">Debug</option>
            </select>
            <button id="search-btn">Search</button>
          </div>
        </div>
        <div id="search-stats" class="search-stats"></div>
        <div id="search-results" class="search-results"></div>
      </section>

      <section class="chart-panel glass">
        <div class="section-header">
          <h2>Log Volume (30 Days)</h2>
          <div class="controls">
            <button id="chart-refresh">Refresh</button>
          </div>
        </div>
        <div class="chart-container">
          <svg id="log-count-chart"></svg>
        </div>
      </section>

      <section class="error-monitor glass" id="error-monitor">
        <div class="section-header">
          <h2>Notable Incidents</h2>
          <div class="controls">
            <label>
              Show last
              <select id="error-limit">
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="10">10</option>
                <option value="16">16</option>
              </select>
              windows
            </label>
            <button id="error-refresh">Refresh</button>
          </div>
        </div>
        <div id="error-feed" class="card-grid tight"></div>
      </section>

      <section class="trend-panel glass" id="trend-panel">
        <div class="section-header">
          <h2>Trend Analysis</h2>
          <div class="controls">
            <label>
              Show last
              <select id="trend-limit">
                <option value="4" selected>4</option>
                <option value="7">7</option>
                <option value="14">14</option>
              </select>
              reports
            </label>
            <button id="trend-refresh">Refresh</button>
          </div>
        </div>
        <div id="trend-feed" class="card-grid tight"></div>
      </section>

      <section class="daily-panel glass">
        <div class="section-header">
          <h2>Daily Summaries</h2>
          <div class="controls">
            <label>
              Show last
              <select id="daily-limit">
                <option value="4" selected>4</option>
                <option value="7">7</option>
                <option value="10">10</option>
                <option value="14">14</option>
              </select>
              days
            </label>
            <button id="daily-refresh">Refresh</button>
          </div>
        </div>
        <div id="daily-container" class="card-grid"></div>
      </section>
    </main>

    <footer>
      <span>
        Data source:
        <code>/summaries/hourly</code>,
        <code>/summaries/daily</code>,
        <code>/insights/errors</code>
      </span>
      <span class="footer-credit">MithrilLog created by xcr9</span>
    </footer>

    <template id="summary-card-template">
      <article class="card">
        <header>
          <h3 class="card-title"></h3>
          <span class="card-meta"></span>
        </header>
        <section class="card-summary"></section>
        <details>
          <summary>More details</summary>
          <div class="details">
            <div class="stats-grid"></div>
            <div class="highlights-list"></div>
            <pre class="anomalies-text"></pre>
          </div>
        </details>
      </article>
    </template>

    <template id="trend-card-template">
      <article class="card">
        <header>
          <h3 class="card-title"></h3>
          <div class="trend-badges">
            <span class="badge new" title="New Issues"></span>
            <span class="badge ongoing" title="Ongoing Issues"></span>
            <span class="badge resolved" title="Resolved Issues"></span>
          </div>
        </header>
        <section class="card-summary"></section>
        <details>
          <summary>Issue Details</summary>
          <div class="details">
            <div class="trend-lists">
              <div class="trend-column new">
                <h4>New</h4>
                <ul class="issue-list"></ul>
              </div>
              <div class="trend-column ongoing">
                <h4>Ongoing</h4>
                <ul class="issue-list"></ul>
              </div>
              <div class="trend-column resolved">
                <h4>Resolved</h4>
                <ul class="issue-list"></ul>
              </div>
            </div>
          </div>
        </details>
      </article>
    </template>

    <script src="/static/dashboard.js" defer></script>
  </body>
</html>
