services:
  orchestrator:
    build:
      context: .
    image: mithrillog:latest
    command: ["python", "scripts/run_orchestrator.py", "--config", "configs/default.yaml"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
    restart: unless-stopped

  ingester:
    image: mithrillog:latest
    command: ["ingester-rs"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5515:5514/udp"
      - "5615:5614"
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - TZ=Asia/Tehran
      - INGEST_HOST=0.0.0.0
      - INGEST_UDP_PORT=5514
      - INGEST_TCP_PORT=5614
      - INGEST_BUCKET_DIR=./data/buckets
      - INGEST_MAX_BUCKET_MINUTES=1
      - INGEST_BLOOM_ERROR_RATE=0.0001
      - INGEST_RESERVOIR_SIZE=200
      # Optional: forward_to_host and forward_to_port
      # - INGEST_FORWARD_TO_HOST=65.109.200.75
      # - INGEST_FORWARD_TO_PORT=5515
    restart: unless-stopped

  api:
    image: mithrillog:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000"]
    working_dir: /app
    ports:
      - "127.0.0.1:9900:9000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
      - ./app/static:/app/app/static
      - ./app/templates:/app/app/templates
      - ./app/main.py:/app/app/main.py
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
    depends_on:
      - orchestrator
    restart: unless-stopped

