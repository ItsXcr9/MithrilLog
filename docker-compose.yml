services:
  orchestrator:
    build:
      context: .
    image: mithrillog:latest
    command: ["python", "scripts/run_orchestrator.py", "--config", "configs/default.yaml"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
    restart: unless-stopped

  ingester:
    image: mithrillog:latest
    command: ["ingester-rs", "--config", "/app/configs/ingester.yaml"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5515:5514/udp"
      - "5615:5614"
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - TZ=Asia/Tehran
    restart: unless-stopped

  api:
    image: mithrillog:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000", "--reload"]
    working_dir: /app
    ports:
      - "0.0.0.0:9900:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
      - ./app:/app/app
      - ./src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
      # ClickHouse - connects to AncientReport's ClickHouse
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-65.109.200.75}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-6123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-mithrillog}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-AncientReport}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-AncientReport}
    depends_on:
      - orchestrator
    restart: unless-stopped
