# =============================================================================
# MithrilLog Docker Compose - DEPLOY VERSION (pulls from ghcr.io)
# =============================================================================
# Use this file to deploy without needing source files!
# Pull images: docker compose -f docker-compose.deploy.yml pull
# Start:       docker compose -f docker-compose.deploy.yml up -d
# =============================================================================

services:
  orchestrator:
    image: ghcr.io/itsxcr9/mithrillog/app:latest
    container_name: mithrillog-orchestrator
    command: ["python", "scripts/run_orchestrator.py", "--config", "configs/default.yaml"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
    restart: unless-stopped

  ingester:
    image: ghcr.io/itsxcr9/mithrillog/app:latest
    container_name: mithrillog-ingester
    command: ["ingester-rs", "--config", "/app/configs/ingester.yaml"]
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5515:5514/udp"
      - "5615:5614"
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - TZ=Asia/Tehran
    restart: unless-stopped

  api:
    image: ghcr.io/itsxcr9/mithrillog/app:latest
    container_name: mithrillog-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000"]
    working_dir: /app
    ports:
      - "0.0.0.0:9900:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./models:/app/models
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tehran
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-localhost}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-6123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-mithrillog}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    depends_on:
      - orchestrator
    restart: unless-stopped

  admin-go:
    image: ghcr.io/itsxcr9/mithrillog/admin-go:latest
    container_name: mithrillog-admin
    ports:
      - "9999:9999"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Tehran
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-localhost}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-6123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-mithrillog}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    restart: unless-stopped

  gateway:
    image: ghcr.io/itsxcr9/mithrillog/gateway:latest
    container_name: mithrillog-gateway
    ports:
      - "8000:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Tehran
    restart: unless-stopped
